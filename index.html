<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong SPA</title>
<style>
body{
  margin:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
}

#gameWrapper{
  text-align:center;
}

canvas{
  background:#020617;
  border:3px solid #38bdf8;
}

#score{
  margin-bottom:10px;
  font-size:24px;
}
</style>
</head>
<body>

<div id="gameWrapper">
<div id="score">0 : 0</div>
<canvas id="pong" width="800" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const paddleWidth = 12;
const paddleHeight = 100;

let player = {
  x: 10,
  y: canvas.height/2 - paddleHeight/2,
  score: 0
};

let ai = {
  x: canvas.width - paddleWidth - 10,
  y: canvas.height/2 - paddleHeight/2,
  score: 0
};

let ball = {
  x: canvas.width/2,
  y: canvas.height/2,
  r: 8,
  speed: 5,
  vx: 5,
  vy: 5
};

canvas.addEventListener("mousemove", e=>{
  const rect = canvas.getBoundingClientRect();
  player.y = e.clientY - rect.top - paddleHeight/2;
});

function drawRect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);
}

function drawBall(){
  ctx.fillStyle="#22c55e";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
}

function resetBall(){
  ball.x = canvas.width/2;
  ball.y = canvas.height/2;
  ball.vx = -ball.vx;
}

function collision(p,b){
  return b.x - b.r < p.x + paddleWidth &&
         b.x + b.r > p.x &&
         b.y - b.r < p.y + paddleHeight &&
         b.y + b.r > p.y;
}

function update(){

  ball.x += ball.vx;
  ball.y += ball.vy;

  // wall bounce
  if(ball.y + ball.r > canvas.height || ball.y - ball.r < 0){
    ball.vy *= -1;
  }

  // AI follow
  ai.y += (ball.y - (ai.y + paddleHeight/2)) * 0.08;

  let paddle = ball.x < canvas.width/2 ? player : ai;

  if(collision(paddle, ball)){
    ball.vx *= -1;
  }

  // score
  if(ball.x < 0){
    ai.score++;
    resetBall();
  }

  if(ball.x > canvas.width){
    player.score++;
    resetBall();
  }

  scoreText.textContent = player.score + " : " + ai.score;
}

function draw(){

  drawRect(0,0,canvas.width,canvas.height,"#020617");

  // center line
  for(let i=0;i<canvas.height;i+=30){
    drawRect(canvas.width/2-1,i,2,20,"#334155");
  }

  drawRect(player.x,player.y,paddleWidth,paddleHeight,"#38bdf8");
  drawRect(ai.x,ai.y,paddleWidth,paddleHeight,"#f43f5e");

  drawBall();
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
