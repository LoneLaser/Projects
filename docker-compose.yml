services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: report-gen-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/database/app.db
      - REPORTS_DIR=/app/reports/generated
      - CORS_ORIGIN=http://localhost
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-change-me-to-a-random-secret}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - ./database:/app/database
      - ./reports:/app/reports

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: report-gen-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
